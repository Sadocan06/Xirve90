<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e0d">
  <title>Zirve90 | Maç Merkezi</title>
  <link rel="stylesheet" href="./style.css?v=207">>
</head>
<body>
  <div id="app">Zirve90 yükleniyor...</div>
  <script src="./app.js?v=103" defer></script>

  
<style>
#sideMenu {
  position: fixed;
  top: 0;
  left: 0;
  width: 82%;
  max-width: 320px;
  height: 100dvh;
  background: #101a14;
  color: white;
  z-index: 1001;
  transform: translateX(-105%);
  transition: transform .25s ease;
  overflow-y: auto;
  padding: 22px 18px;
  box-shadow: 5px 0 30px #0007;
}
#sideMenu.open {
  transform: translateX(0);
}
#menuOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 1000;
}
#menuOverlay.open {
  display: block;
}
#sideMenu button {
  display: block;
  width: 100%;
  padding: 15px 10px;
  text-align: left;
  background: transparent;
  color: white;
  border: 0;
  border-bottom: 1px solid #2b4030;
}
</style>

<div id="menuOverlay"></div>

<aside id="sideMenu">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <strong style="font-size:23px">ZİRVE<span style="color:#b6ff38">90</span></strong>
    <button id="closeMenu" style="width:auto">✕</button>
  </div>

  <button data-menu-page="login">👤 Giriş Yap / Üye Ol</button>
  <button data-menu-page="home">⚽ Canlı Skor</button>
  <button data-menu-page="matches">📅 Maçlar</button>
  <button data-menu-page="standings">🏆 Puan Durumu</button>
  <button data-menu-page="leagues">🌍 Ligler</button>
  <button data-menu-page="news">📰 Haberler</button>
  <button data-menu-page="videos">▶️ Videolar</button>
  <button data-menu-page="favorites">⭐ Favoriler</button>
  <button data-menu-page="more">⚙️ Ayarlar</button>
</aside>

<script>
(function(){
  const menu = document.getElementById('sideMenu');
  const overlay = document.getElementById('menuOverlay');

  function closeMenu(){
    menu.classList.remove('open');
    overlay.classList.remove('open');
  }

  document.addEventListener('click', function(e){
    if(e.target.closest('#menuBtn')){
      menu.classList.add('open');
      overlay.classList.add('open');
    }

    if(e.target.closest('#closeMenu') || e.target === overlay){
      closeMenu();
    }

    const item = e.target.closest('[data-menu-page]');
    if(item){
      closeMenu();
      const page = item.dataset.menuPage;
      const nav = document.querySelector('[data-go="' + page + '"]');
      if(nav) nav.click();
    }
  });
})();
</script>

</body>
</html>
